# guardar como /etc/supervisor/conf.d/reverb.conf
[program:reverb]
command=php /ruta/al/backend/artisan reverb:start
directory=/ruta/al/backend
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/reverb.log
stopasgroup=true
killasgroup=true

# aprovecha y deja el worker de colas igual de persistente (exportaciones, reportes, notificaciones)
[program:queue-worker]
command=php /ruta/al/backend/artisan queue:work --sleep=3 --tries=3
directory=/ruta/al/backend
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/queue-worker.log
stopasgroup=true
killasgroup=true
