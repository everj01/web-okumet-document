server {
    listen 80;
    server_name document.okumet.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name document.okumet.com;

    ssl_certificate     /etc/letsencrypt/live/document.okumet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/document.okumet.com/privkey.pem;

    # carpeta que contiene el build de Astro (raiz) y, dentro, la carpeta app/
    root /ruta/a/document.okumet.com;
    index index.html;

    # sitio Astro (raiz del dominio)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA del okd-frontend, montado bajo /app/
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
}
