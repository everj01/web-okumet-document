# Agregar DENTRO del bloque "server { listen 443 ssl ... server_name api.okumet.com; }"
# que ya existe para Laravel, junto al location que maneja PHP-FPM.

location /app {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # los websockets quedan abiertos mucho tiempo: sin esto nginx los corta por inactividad
    proxy_read_timeout 86400;
}
